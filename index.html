<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nokia Had</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:8px}
.phone{width:min(430px,97vw);height:min(840px,98vh);padding:16px 20px;border:4px solid #77776c;border-radius:42px 42px 60px 60px;background:linear-gradient(145deg,#d2d2c4,#99998d);box-shadow:0 20px 50px #0009;display:flex;flex-direction:column;align-items:center;gap:8px}
.speaker{width:90px;height:8px;background:#494943;border-radius:8px}
.brand{font-size:20px;font-weight:900;letter-spacing:4px}
.screen-shell{width:100%;background:#50504b;border-radius:20px 20px 30px 30px;padding:14px}
.screen{width:100%;aspect-ratio:1;background:#9dad75;border:5px solid #31332c;position:relative;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.hud{position:absolute;left:7px;right:7px;top:5px;display:flex;justify-content:space-between;font:900 13px "Courier New";color:#1f2b17;pointer-events:none}
.overlay{position:absolute;inset:0;background:#9dad75eF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#1f2b17;font-family:"Courier New";text-align:center}
.overlay.hidden{display:none}.overlay h1{font-size:34px;margin:0}.overlay p{font-weight:bold;margin:0}
.start{padding:10px 20px;border:3px solid #1f2b17;background:transparent;color:#1f2b17;font:bold 17px "Courier New"}
.controls{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-around;min-height:300px}
.softkeys{width:88%;display:flex;justify-content:space-between}
.soft{width:100px;height:34px;border:0;border-radius:17px;background:linear-gradient(#eeeede,#bdbdb1);box-shadow:0 5px #68685f;font-weight:bold}
.dpad{width:330px;height:230px;position:relative}
.key{position:absolute;width:72px;height:72px;border:0;border-radius:20px;background:linear-gradient(145deg,#ececdf,#b5b5a9);box-shadow:0 6px #6f6f65;color:#37372f;font-size:29px;font-weight:900;touch-action:manipulation}
.key:active,.soft:active{transform:translateY(4px);box-shadow:0 2px #6f6f65}
.up{left:129px;top:0}
.down{left:129px;bottom:0}
.left{left:18px;top:79px}
.right{right:18px;top:79px}
.hint{font-size:11px;font-weight:bold;color:#44443d;text-align:center}
@media(max-height:730px){
.phone{padding:9px 15px;gap:4px}.screen-shell{padding:9px}.controls{min-height:235px}.dpad{transform:scale(.82);margin:-12px 0}.soft{height:29px}.hint{font-size:9px}
}
</style>
</head>
<body>
<div class="phone">
<div class="speaker"></div><div class="brand">NOKIA</div>
<div class="screen-shell"><div class="screen">
<canvas id="game" width="300" height="300"></canvas>
<div class="hud"><span>SKÓRE: <b id="score">0</b></span><span>REKORD: <b id="high">0</b></span></div>
<div class="overlay" id="overlay"><h1>HAD</h1><p>Klasická Nokia</p><button class="start" id="start">SPUSTIT</button></div>
</div></div>
<div class="controls">
<div class="softkeys"><button class="soft" id="pause">PAUZA</button><button class="soft" id="restart">NOVÁ HRA</button></div>
<div class="dpad">
<button class="key up" data-d="up">▲</button>
<button class="key left" data-d="left">◀</button>
<button class="key right" data-d="right">▶</button>
<button class="key down" data-d="down">▼</button>
</div>
<div class="hint">Had začíná pomalu a postupně zrychluje.</div>
</div></div>
<script>
(()=>{
const c=document.getElementById("game"),x=c.getContext("2d"),S=20,C=c.width/S;
const scoreE=document.getElementById("score"),highE=document.getElementById("high"),ov=document.getElementById("overlay");
let snake,dir,next,food,score=0,high=+(localStorage.nokiaSnakeHigh||0),run=false,pause=false,timer,speed=420;
highE.textContent=high;
function foodNew(){do{food={x:Math.floor(Math.random()*S),y:Math.floor(Math.random()*S)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next={...dir};score=0;speed=420;scoreE.textContent=0;foodNew();draw()}
function loop(){clearInterval(timer);timer=setInterval(tick,speed)}
function start(){reset();run=true;pause=false;ov.classList.add("hidden");document.getElementById("pause").textContent="PAUZA";loop()}
function tick(){if(!run||pause)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};h.x=(h.x+S)%S;h.y=(h.y+S)%S;let eat=h.x===food.x&&h.y===food.y,body=eat?snake:snake.slice(0,-1);if(body.some(p=>p.x===h.x&&p.y===h.y))return over();snake.unshift(h);if(eat){score+=10;scoreE.textContent=score;foodNew();let ns=Math.max(110,420-Math.floor(score/50)*20);if(ns!==speed){speed=ns;loop()}}else snake.pop();draw()}
function over(){run=false;clearInterval(timer);if(score>high){high=score;localStorage.nokiaSnakeHigh=high;highE.textContent=high}ov.innerHTML=`<h1>KONEC</h1><p>Skóre: ${score}</p><p>Rekord: ${high}</p><button class="start" id="again">ZNOVU</button>`;ov.classList.remove("hidden");document.getElementById("again").onclick=start}
function setD(n){let d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[n];if(d.x===-dir.x&&d.y===-dir.y)return;next=d}
function draw(){x.fillStyle="#9dad75";x.fillRect(0,0,c.width,c.height);x.fillStyle="#1f2b17";x.fillRect(food.x*C+3,food.y*C+3,C-6,C-6);snake.forEach((p,i)=>x.fillRect(p.x*C+(i?2:1),p.y*C+(i?2:1),C-(i?4:2),C-(i?4:2)))}
document.querySelectorAll("[data-d]").forEach(b=>b.onpointerdown=e=>{e.preventDefault();setD(b.dataset.d)});
document.onkeydown=e=>{let k=e.key.toLowerCase();if(k==="arrowup"||k==="w")setD("up");if(k==="arrowdown"||k==="s")setD("down");if(k==="arrowleft"||k==="a")setD("left");if(k==="arrowright"||k==="d")setD("right")};
document.getElementById("start").onclick=start;document.getElementById("restart").onclick=start;
document.getElementById("pause").onclick=()=>{if(!run)return start();pause=!pause;document.getElementById("pause").textContent=pause?"POKRAČOVAT":"PAUZA"};
reset();
})();
</script>
</body></html>
