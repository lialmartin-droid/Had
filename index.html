<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Nokia Had</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="phone">
  <div class="speaker"></div>
  <div class="brand">NOKIA</div>

  <section class="screen-shell">
    <div class="screen">
      <canvas id="game" width="420" height="420"></canvas>
      <div class="hud">
        <span>SKÓRE: <b id="score">0</b></span>
        <span>REKORD: <b id="high">0</b></span>
      </div>

      <div class="overlay" id="overlay">
        <h1>HAD</h1>
        <p>Vyber si svého hada</p>

        <div class="snake-picker">
          <button class="skin active" data-skin="green" title="Zelený"></button>
          <button class="skin yellow" data-skin="yellow" title="Žlutý"></button>
          <button class="skin red" data-skin="red" title="Červený"></button>
          <button class="skin blue" data-skin="blue" title="Modrý"></button>
          <button class="skin orange" data-skin="orange" title="Oranžový"></button>
          <button class="skin custom" id="customBtn" title="Vlastní">+</button>
        </div>

        <div id="customPanel" class="custom-panel hidden">
          <label>Barva těla <input type="color" id="mainColor" value="#4e9f32"></label>
          <label>Barva vzoru <input type="color" id="patternColor" value="#172b13"></label>
        </div>

        <button class="start" id="start">SPUSTIT</button>
      </div>
    </div>
  </section>

  <section class="controls">
    <div class="softkeys">
      <button class="soft" id="pause">PAUZA</button>
      <button class="soft" id="restart">NOVÁ HRA</button>
    </div>

    <div class="dpad">
      <button class="key up" data-d="up">▲</button>
      <button class="key left" data-d="left">◀</button>
      <button class="key right" data-d="right">▶</button>
      <button class="key down" data-d="down">▼</button>
    </div>

    <div class="hint">Had prochází zdmi. Konec je jen při nárazu do sebe.</div>
  </section>
</main>
<script src="game.js"></script>
</body>
</html>
