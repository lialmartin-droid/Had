<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nokia Had</title>
<style>
  :root{
    --bg:#1b1b1b;
    --phone:#b8b8aa;
    --phone-dark:#858578;
    --screen:#9dad75;
    --pixel:#1f2b17;
    --btn:#dadad0;
    --btn-shadow:#6f6f65;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:
      radial-gradient(circle at 50% 20%, #343434 0%, #171717 55%, #0d0d0d 100%);
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    color:#111;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
  }

  .phone{
    width:min(430px, 96vw);
    height:min(820px, 97vh);
    border-radius:45px 45px 65px 65px;
    background:linear-gradient(145deg,#d2d2c4,#a9a99c 55%,#8e8e82);
    box-shadow:
      inset 0 3px 2px rgba(255,255,255,.7),
      inset 0 -8px 12px rgba(0,0,0,.2),
      0 22px 55px rgba(0,0,0,.55);
    border:4px solid #77776c;
    position:relative;
    padding:22px 24px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }

  .brand{
    font-weight:900;
    letter-spacing:4px;
    font-size:22px;
    color:#202020;
    margin-top:2px;
  }

  .speaker{
    width:95px;
    height:10px;
    border-radius:10px;
    background:#494943;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.8);
    margin-bottom:2px;
  }

  .screen-shell{
    width:100%;
    background:#50504b;
    border-radius:20px 20px 35px 35px;
    padding:18px 16px 21px;
    box-shadow:
      inset 0 4px 10px rgba(0,0,0,.55),
      0 2px 1px rgba(255,255,255,.4);
  }

  .screen{
    width:100%;
    aspect-ratio:1/1;
    max-height:390px;
    background:var(--screen);
    border:5px solid #31332c;
    box-shadow:
      inset 0 0 18px rgba(34,45,25,.25),
      0 0 0 2px #aeb29c;
    position:relative;
    image-rendering:pixelated;
  }

  canvas{
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
  }

  .hud{
    position:absolute;
    left:8px;
    right:8px;
    top:6px;
    display:flex;
    justify-content:space-between;
    font-family:"Courier New",monospace;
    font-weight:900;
    color:var(--pixel);
    font-size:14px;
    text-shadow:1px 1px 0 rgba(255,255,255,.18);
    pointer-events:none;
  }

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:rgba(157,173,117,.9);
    color:var(--pixel);
    font-family:"Courier New",monospace;
    text-align:center;
    padding:25px;
  }

  .overlay.hidden{display:none}

  .overlay h1{
    margin:0;
    font-size:34px;
    line-height:1;
    letter-spacing:2px;
  }

  .overlay p{
    margin:0;
    font-size:15px;
    font-weight:700;
  }

  .start-btn{
    border:3px solid var(--pixel);
    background:transparent;
    color:var(--pixel);
    font-family:"Courier New",monospace;
    font-weight:900;
    font-size:17px;
    padding:10px 18px;
    cursor:pointer;
  }

  .controls-wrap{
    width:100%;
    flex:1;
    min-height:245px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    padding-top:4px;
  }

  .softkeys{
    width:82%;
    display:flex;
    justify-content:space-between;
  }

  .softkey{
    width:92px;
    height:36px;
    border-radius:18px;
    border:0;
    background:linear-gradient(#eeeede,#bdbdb1);
    box-shadow:
      0 5px 0 #68685f,
      inset 0 2px 2px rgba(255,255,255,.9);
    font-weight:800;
    color:#444;
    cursor:pointer;
  }

  .dpad{
    width:190px;
    height:190px;
    position:relative;
  }

  .key{
    position:absolute;
    width:68px;
    height:68px;
    border:none;
    border-radius:19px;
    background:linear-gradient(145deg,#ececdf,#b5b5a9);
    box-shadow:
      0 6px 0 var(--btn-shadow),
      inset 0 2px 2px rgba(255,255,255,.9);
    color:#37372f;
    font-size:28px;
    font-weight:900;
    user-select:none;
    cursor:pointer;
    touch-action:manipulation;
  }

  .key:active,.softkey:active{
    transform:translateY(4px);
    box-shadow:
      0 2px 0 var(--btn-shadow),
      inset 0 2px 2px rgba(255,255,255,.9);
  }

  .up{left:61px;top:0}
  .down{left:61px;bottom:0}
  .left{left:0;top:61px}
  .right{right:0;top:61px}
  .center{
    left:61px;
    top:61px;
    border-radius:50%;
    font-size:14px;
  }

  .hint{
    font-size:11px;
    color:#44443d;
    text-align:center;
    font-weight:700;
    margin-top:-4px;
  }

  @media (max-height:700px){
    .phone{
      height:98vh;
      padding:12px 18px 14px;
      gap:7px;
    }
    .brand{font-size:18px}
    .speaker{height:7px}
    .screen-shell{padding:12px 12px 14px}
    .controls-wrap{min-height:205px}
    .dpad{transform:scale(.8);margin-top:-18px;margin-bottom:-18px}
    .softkey{height:30px}
    .hint{font-size:10px}
  }
</style>
</head>
<body>

<div class="phone">
  <div class="speaker"></div>
  <div class="brand">NOKIA</div>

  <div class="screen-shell">
    <div class="screen">
      <canvas id="game" width="300" height="300"></canvas>
      <div class="hud">
        <div>SKÓRE: <span id="score">0</span></div>
        <div>REKORD: <span id="high">0</span></div>
      </div>

      <div class="overlay" id="overlay">
        <h1>HAD</h1>
        <p>Ve stylu staré Nokie</p>
        <button class="start-btn" id="startBtn">SPUSTIT</button>
        <p>Šipky / WASD / tlačítka</p>
      </div>
    </div>
  </div>

  <div class="controls-wrap">
    <div class="softkeys">
      <button class="softkey" id="pauseBtn">PAUZA</button>
      <button class="softkey" id="restartBtn">NOVÁ HRA</button>
    </div>

    <div class="dpad">
      <button class="key up" data-dir="up">▲</button>
      <button class="key left" data-dir="left">◀</button>
      <button class="key center" id="centerBtn">OK</button>
      <button class="key right" data-dir="right">▶</button>
      <button class="key down" data-dir="down">▼</button>
    </div>

    <div class="hint">Sněz čtvereček a nenaraz do sebe.</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('high');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');
  const centerBtn = document.getElementById('centerBtn');

  const COLS = 20;
  const ROWS = 20;
  const CELL = canvas.width / COLS;
  const BG = '#9dad75';
  const PIXEL = '#1f2b17';

  let snake;
  let dir;
  let nextDir;
  let food;
  let score = 0;
  let high = Number(localStorage.getItem('nokiaSnakeHigh') || 0);
  let running = false;
  let paused = false;
  let timer = null;
  let speed = 230;

  highEl.textContent = high;

  function resetGame() {
    snake = [
      {x: 10, y: 10},
      {x: 9, y: 10},
      {x: 8, y: 10},
      {x: 7, y: 10}
    ];
    dir = {x: 1, y: 0};
    nextDir = {...dir};
    score = 0;
    speed = 230;
    scoreEl.textContent = score;
    placeFood();
    draw();
  }

  function placeFood() {
    let candidate;
    do {
      candidate = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    } while (snake && snake.some(s => s.x === candidate.x && s.y === candidate.y));
    food = candidate;
  }

  function startGame() {
    resetGame();
    running = true;
    paused = false;
    overlay.classList.add('hidden');
    pauseBtn.textContent = 'PAUZA';
    restartLoop();
  }

  function restartLoop() {
    clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function tick() {
    if (!running || paused) return;

    dir = nextDir;
    const head = {
      x: snake[0].x + dir.x,
      y: snake[0].y + dir.y
    };

    // Klasický Nokia styl: náraz do zdi = konec.
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }

    // Je dovoleno vstoupit na poslední článek ocasu, pokud se právě neposouváme s růstem.
    const eating = head.x === food.x && head.y === food.y;
    const bodyToCheck = eating ? snake : snake.slice(0, -1);

    if (bodyToCheck.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (eating) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();

      const newSpeed = Math.max(85, 230 - Math.floor(score / 50) * 12);
      if (newSpeed !== speed) {
        speed = newSpeed;
        restartLoop();
      }
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver() {
    running = false;
    clearInterval(timer);

    if (score > high) {
      high = score;
      localStorage.setItem('nokiaSnakeHigh', high);
      highEl.textContent = high;
    }

    overlay.innerHTML = `
      <h1>KONEC</h1>
      <p>Skóre: ${score}</p>
      <p>Rekord: ${high}</p>
      <button class="start-btn" id="againBtn">ZNOVU</button>
      <p>Stejně jako na Nokii.</p>
    `;
    overlay.classList.remove('hidden');
    document.getElementById('againBtn').addEventListener('click', startGame);
  }

  function togglePause() {
    if (!running) {
      startGame();
      return;
    }
    paused = !paused;
    pauseBtn.textContent = paused ? 'POKRAČOVAT' : 'PAUZA';
  }

  function setDirection(name) {
    const dirs = {
      up: {x:0,y:-1},
      down: {x:0,y:1},
      left: {x:-1,y:0},
      right: {x:1,y:0}
    };
    const wanted = dirs[name];
    if (!wanted) return;

    // zákaz otočení o 180°
    if (wanted.x === -dir.x && wanted.y === -dir.y) return;
    nextDir = wanted;
  }

  function drawPixelRect(x, y, w, h, inset=2) {
    ctx.fillStyle = PIXEL;
    ctx.fillRect(
      x * CELL + inset,
      y * CELL + inset,
      w * CELL - inset * 2,
      h * CELL - inset * 2
    );
  }

  function draw() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // jemný LCD raster
    ctx.strokeStyle = 'rgba(31,43,23,.07)';
    ctx.lineWidth = 1;
    for(let x=0;x<=COLS;x++){
      ctx.beginPath();
      ctx.moveTo(x*CELL,0);
      ctx.lineTo(x*CELL,canvas.height);
      ctx.stroke();
    }
    for(let y=0;y<=ROWS;y++){
      ctx.beginPath();
      ctx.moveTo(0,y*CELL);
      ctx.lineTo(canvas.width,y*CELL);
      ctx.stroke();
    }

    // jídlo
    drawPixelRect(food.x, food.y, 1, 1, 3);

    // had
    snake.forEach((part, i) => {
      const inset = i === 0 ? 1 : 2;
      drawPixelRect(part.x, part.y, 1, 1, inset);
    });

    // oči na hlavě
    const h = snake[0];
    ctx.fillStyle = BG;
    const eye = 2.5;
    if (dir.x === 1) {
      ctx.fillRect(h.x*CELL + CELL-5, h.y*CELL+3, eye, eye);
      ctx.fillRect(h.x*CELL + CELL-5, h.y*CELL+CELL-6, eye, eye);
    } else if (dir.x === -1) {
      ctx.fillRect(h.x*CELL + 2, h.y*CELL+3, eye, eye);
      ctx.fillRect(h.x*CELL + 2, h.y*CELL+CELL-6, eye, eye);
    } else if (dir.y === -1) {
      ctx.fillRect(h.x*CELL + 3, h.y*CELL+2, eye, eye);
      ctx.fillRect(h.x*CELL + CELL-6, h.y*CELL+2, eye, eye);
    } else {
      ctx.fillRect(h.x*CELL + 3, h.y*CELL+CELL-5, eye, eye);
      ctx.fillRect(h.x*CELL + CELL-6, h.y*CELL+CELL-5, eye, eye);
    }
  }

  document.querySelectorAll('[data-dir]').forEach(btn => {
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      setDirection(btn.dataset.dir);
    });
  });

  document.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    if (['arrowup','w'].includes(key)) setDirection('up');
    else if (['arrowdown','s'].includes(key)) setDirection('down');
    else if (['arrowleft','a'].includes(key)) setDirection('left');
    else if (['arrowright','d'].includes(key)) setDirection('right');
    else if (key === ' ' || key === 'enter') togglePause();
  });

  let touchStartX = 0;
  let touchStartY = 0;

  canvas.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, {passive:true});

  canvas.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 'right' : 'left');
    } else {
      setDirection(dy > 0 ? 'down' : 'up');
    }
  }, {passive:true});

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
  pauseBtn.addEventListener('click', togglePause);
  centerBtn.addEventListener('click', togglePause);

  resetGame();
})();
</script>
</body>
</html>
